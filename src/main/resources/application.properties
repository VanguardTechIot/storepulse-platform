spring.application.name=storepulse-rest-api

# Database. Override with environment variables; never commit real credentials.
spring.datasource.url=${DB_URL: jdbc:mysql://localhost:3306/storepulse?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME: root}
spring.datasource.password=${DB_PASSWORD: }

#Tables are generated from the aggregates while the schema is still moving.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# OpenAPI documentation (Swagger UI at /swagger-ui.html, JSON at /v3/api-docs).
springdoc.swagger-ui.path=/swagger-ui.html

# Identity and Access Management.
# JWT signing key: Base64 value of at least 256 bits (for example `openssl rand -base64 32`).
storepulse.iam.jwt.secret=${JWT_SECRET}
storepulse.iam.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:1440}
# Password recovery codes are delivered through the Firebase "Trigger Email from Firestore"
# extension: the service account key file and the collection the extension listens to.
storepulse.iam.firebase.credentials-path=${FIREBASE_CREDENTIALS_PATH:}
storepulse.iam.firebase.mail-collection=${FIREBASE_MAIL_COLLECTION:mail}
# Origins allowed to call the API from a browser, separated by commas.
storepulse.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

