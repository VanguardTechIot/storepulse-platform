spring.application.name=storepulse-rest-api

# Profile: dev (local database) by default; production sets SPRING_PROFILES_ACTIVE=prod.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

spring.jpa.open-in-view=false

# OpenAPI documentation (Swagger UI at /swagger-ui.html, JSON at /v3/api-docs).
springdoc.swagger-ui.path=/swagger-ui.html

# Identity and Access Management.
# JWT signing key: Base64 value of at least 256 bits (for example `openssl rand -base64 32`).
storepulse.iam.jwt.secret=${JWT_SECRET}
storepulse.iam.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:1440}
# Emails (password recovery codes, tenant invitations) are delivered through the Firebase
# "Trigger Email from Firestore" extension: the service account key file and the collection the
# extension listens to. Without a key file, the emails are written to the log.
storepulse.firebase.credentials-path=${FIREBASE_CREDENTIALS_PATH:}
storepulse.firebase.mail-collection=${FIREBASE_MAIL_COLLECTION:mail}
# Page of the web application where a tenant accepts an invitation; the token is added as ?token=.
storepulse.web.invitation-url=${WEB_INVITATION_URL:http://localhost:4200/invitations/accept}
# Origins allowed to call the API from a browser, separated by commas.
storepulse.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}