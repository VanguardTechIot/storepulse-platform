# Every value comes from the environment of the deployment; there are no defaults on purpose.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update

# Production always delivers real emails.
storepulse.firebase.credentials-path=${FIREBASE_CREDENTIALS_PATH}

# The demo gallery is off unless the deployment turns it on with DEMO_DATA_ENABLED=true.
storepulse.demo.enabled=${DEMO_DATA_ENABLED:true}