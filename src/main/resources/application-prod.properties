# Every value comes from the environment of the deployment; there are no defaults on purpose.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update

# Production always delivers real emails and links to the deployed web application.
storepulse.firebase.credentials-path=${FIREBASE_CREDENTIALS_PATH}
storepulse.web.invitation-url=${WEB_INVITATION_URL}