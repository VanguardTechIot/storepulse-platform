# Local database. Override with environment variables (see .env.example); never commit real credentials.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/storepulse?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# Tables are generated from the aggregates while the schema is still moving.
spring.jpa.hibernate.ddl-auto=update